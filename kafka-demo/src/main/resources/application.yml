server:
  port: 8095

spring:
  application:
    name: kafka-demo
  
  kafka:
    bootstrap-servers: localhost:29092,localhost:29093,localhost:29094
    
    topic:
      name: chat-message-topic
      partitions: 3
      replication-factor: 2
      
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 1
      buffer-memory: 33554432
      
    consumer:
      group-id: consumer-demo-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.json.trusted.packages: "com.im.dto"
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.im.dto.ChatMessage
        spring.json.type.mapping: "chatMessage:com.im.dto.ChatMessage"
      enable-auto-commit: false
      
    listener:
      ack-mode: manual_immediate

logging:
  level:
    com.im: DEBUG
    org.springframework.kafka: INFO

im:
  kafka:
    topics:
      chat-message: "chat-message-topic"
      chat-message-retry: "chat-message-retry-topic"
      chat-message-dlt: "chat-message-dlt-topic"

kafka:
  producer:
    retry:
      max-attempts: 3
      delay-ms: 1000
  retry:
    max-attempts: 3
    delay-ms: 1000