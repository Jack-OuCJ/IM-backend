server:
  port: 8083

spring:
  application:
    name: message-sequence-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: nacos
      config:
        server-addr: localhost:8848
        username: nacos
        password: nacos
        file-extension: yml

# Redis配置
spring:
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# 时序数据库配置
timeseries:
  type: INFLUXDB
  influxdb:
    url: http://localhost:8086
    token: ${INFLUXDB_TOKEN:your_influxdb_token}
    org: im-org
    bucket: im-messages
    enabled: true
  tdengine:
    url: jdbc:TAOS://localhost:6030/
    username: root
    password: taosdata
    database: im_messages
    enabled: false

# 消息序列号配置
message:
  sequence:
    expire-time: 604800 # 7天过期

# 日志配置
logging:
  level:
    com.tencent.im.backend: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%logger{50}] - %msg%n"

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
