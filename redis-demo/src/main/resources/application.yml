server:
  port: 8096

spring:
  application:
    name: redis-demo
    
  # Redis Configuration with Connection Pool and Timeout Settings
  redis:
    host: localhost
    port: 6379
    database: 0
    password: # Set password if Redis auth is enabled
    timeout: 3000ms # Connection timeout
    connect-timeout: 3000ms # Connection establishment timeout
    
    # Lettuce Connection Pool Configuration  
    lettuce:
      pool:
        max-active: 20 # Maximum number of connections in pool
        max-idle: 10 # Maximum number of idle connections
        min-idle: 5 # Minimum number of idle connections
        max-wait: 2000ms # Maximum wait time for connection from pool
        time-between-eviction-runs: 30000ms # Eviction thread run interval
      shutdown-timeout: 100ms # Graceful shutdown timeout

# Redisson Configuration for Distributed Lock
redisson:
  address: redis://localhost:6379
  database: 1 # Use different database for distributed locks
  connection-pool-size: 20
  connection-minimum-idle-size: 5
  idle-connection-timeout: 10000
  timeout: 3000

# Redis Best Practices Configuration
redis:
  key:
    # Business prefix for key naming convention
    prefix: "im:demo"
    # TTL configuration with jitter to prevent cache avalanche
    ttl:
      default: 600 # 10 minutes
      jitter-range: 120 # ±2 minutes random jitter
      max: 3600 # 1 hour maximum
      
  # Slow query log configuration
  slowlog:
    max-len: 1000
    slower-than: 10000 # Log queries slower than 10ms
    
  # Memory configuration
  memory:
    max-memory: "256mb"
    policy: "allkeys-lru" # LRU eviction policy

logging:
  level:
    com.im.redis: DEBUG
    org.springframework.data.redis: INFO
    org.redisson: INFO
